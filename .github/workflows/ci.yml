name: CI

permissions:
  contents: read

on:
  push:
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    env:
      UV_PYTHON: ${{ matrix.python-version }}
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      # The CUDA and CPU torch wheels plus TensorRT overflow the runner's default free disk.
      - name: Free disk space
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Install
        run: uv sync --extra filter --extra hdf5 --extra tensorrt --group dev
      - name: Use CPU torch
        run: uv pip install --no-deps --reinstall torch==2.14.1 torchvision==0.29.1 --index-url https://download.pytorch.org/whl/cpu
      - name: Clear uv cache
        run: uv cache clean
      - name: Check and test
        # Source-golden tests depend on the CPU the goldens were made on; GitLab CI runs them.
        run: uv run --no-sync make check test TEST_MARKERS="not gpu and not isaac and not source_golden"
