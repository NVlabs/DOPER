[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "doper"
dynamic = ["version"]
readme = "README.md"
description = "DOPER pose estimation"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.md"]
dependencies = [
    "torch>=2.12",
    # torchvision 0.27 is the release paired with torch 2.12.
    "torchvision>=0.27",
    # timm 1.0.20 is the first release registering convnext_small.dinov3_lvd1689m.
    "timm>=1.0.20",
    # checkpoint_io uses the numpy.dtypes module added in numpy 1.25.
    "numpy>=1.25",
    # 4.10.0.84 is the first OpenCV wheel built against numpy 2.
    "opencv-python-headless>=4.10.0.84",
    # image_reader reads image headers with Pillow; torchvision already requires it.
    "pillow>=9.0",
    # eval_multiview-style joint PnP uses scipy.optimize.least_squares.
    "scipy>=1.11",
    "PyYAML",
    "pyspng==0.1.4",
]

[project.scripts]
doper = "doper.cli:main"

[project.optional-dependencies]
bop = ["huggingface_hub>=0.24", "trimesh>=4.0"]
# Isaac Sim 6.0.1 ships as a container (nvcr.io/nvidia/isaac-sim:6.0.1), not a wheel.
isaac = []
usd = ["usd-core>=24.5"]
keypoints = ["numba>=0.60"]
# Numba L-BFGS-B heatmap refinement and parallel preparation (Powell needs only SciPy).
refine = ["numba>=0.60"]
# TensorRT itself comes from the platform (pip `tensorrt` on x86, JetPack on Thor);
# the fp16/bf16 benchmark modes need TensorRT 10 (e.g. `tensorrt-cu12<11` on x86).
tensorrt = ["onnx>=1.22"]
realsense = []
filter = ["bayesfilter==0.2.0"]
hdf5 = ["h5py>=3.10"]
# The tracked-landmark extractor merges its feature tracks with scikit-learn DBSCAN.
speedplus = ["scikit-learn>=1.3"]
# SAM2 masks of the NuRec labels stage (`labels.mask_mode: sam2`).
# PyPI sam2 1.1.0 is a repackaging whose `sam2/` tree is byte-identical to upstream
# facebookresearch/sam2 2b90b9f (2024-12-15).
nurec-sam = ["torch>=2.12", "sam2==1.1.0"]

[dependency-groups]
# One dev environment for `make format check test coverage`, including the optional
# runtimes the CPU tests exercise: `uv sync --all-extras --group dev`.
dev = [
    "pytest",
    "pytest-cov",
    "ruff",
    "pyright[nodejs]",
    "pre-commit",
    "build",
    "onnx>=1.22",
    "onnxruntime",
    "h5py>=3.10",
    "bayesfilter==0.2.0",
    "usd-core>=24.5",
    "numba>=0.60",
    "huggingface_hub>=0.24",
    "trimesh>=4.0",
    # BOP toolkit commit the scorer tests compare against (dev only).
    "bop_toolkit_lib @ git+https://github.com/thodan/bop_toolkit@cea62d651c7e395b2e1962b9749e4e89693c6ac4",
    "scikit-learn>=1.3",
]

[tool.setuptools.packages.find]
include = ["doper*"]

[tool.setuptools.package-data]
"doper.recipes" = ["*.yaml", "profiles/*.json", "profiles/resources/*.json"]
"doper._vendor.hot3d_camera" = ["LICENSE", "NOTICE"]
"doper._vendor.bop_toolkit_ap" = ["LICENSE", "NOTICE"]

[tool.setuptools.dynamic]
version = { attr = "doper.__version__" }

[tool.ruff]
line-length = 100
# Vendored upstream code is excluded so it stays byte-close to upstream.
extend-exclude = ["doper/_vendor"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "D", "UP", "B", "SIM", "ANN"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D", "ANN"]
# Blender tests embed the scripts they run inside Blender; those lines stay as written.
"tests/rendering/test_blender_*.py" = ["E501"]
"tests/rendering/test_usd_blender.py" = ["E501"]
# BlenderProc requires `import blenderproc` before anything else, so no docstring and late imports.
"rendering/blenderproc/scene.py" = ["D100", "E402", "I001"]

[tool.pyright]
include = ["doper", "rendering"]
# Vendored upstream code is not annotated to this project's pyright standard.
exclude = ["doper/_vendor"]
typeCheckingMode = "basic"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = [
    "gpu: requires a working CUDA device and TensorRT; skipped by `make test`",
    "blender: needs Blender >= 4.2 (DOPER_BLENDER or PATH); skipped when absent",
    "isaac: needs the Isaac Sim 6.0.1 container; GPU host only",
    "blenderproc: needs BlenderProc 2.8.0 (DOPER_BLENDERPROC_PYTHON), Blender 4.2.1 and a GPU; skipped when absent",
    "slow: CPU smoke runs that train for a few iterations (run by `make test`)",
    "source_golden: bit-exact match to a golden recorded from the original implementation; OpenCV and BLAS pick CPU code paths at runtime, so GitHub-hosted runners deselect it",
]

[tool.uv]
# bop_toolkit_lib (dev-only scorer tests) caps numpy<2 in its metadata; the package itself
# needs numpy>=1.25 and the type stubs assume numpy 2.
# bop_toolkit_lib pulls the GUI opencv-python build, which collides with the headless build on
# the shared cv2 package directory, so it is excluded from resolution.
override-dependencies = ["numpy>=1.25", "opencv-python; sys_platform == 'never'"]
